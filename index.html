<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f232b" />
    <title>Klingelbeek Viewer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="loading" class="loading">
        <div class="loading-text">Loading model…</div>
        <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
      </div>

      <button id="panel-toggle" class="panel-toggle" aria-label="Open panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 15 12 9 18 15"/></svg>
      </button>

      <aside id="side-panel" class="side-panel">
        <div class="panel-section panel-section-building">
          <div class="panel-section-head">Building</div>
          <div id="building-panel"></div>
        </div>
        <div class="panel-section panel-section-mode">
          <div class="panel-section-head">Mode</div>
          <div id="mode-panel"></div>
        </div>
        <div class="panel-section panel-section-content">
          <div id="camera-panel" class="panel-cameras"></div>
          <div id="construction-panel" class="panel-construction hidden"></div>
        </div>
        <div class="panel-right">
          <button id="panel-close" class="panel-icon-btn" aria-label="Close panel" title="Close panel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button id="tuner-toggle" class="panel-icon-btn" aria-label="Settings" title="Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </aside>

      <div id="info-bar" class="info-bar hidden">
        <div class="info-main" id="info-main"></div>
        <button class="info-close" id="info-close" aria-label="Close">×</button>
      </div>

      <div id="render-panel" class="render-panel hidden">
        <div class="render-header">
          <span id="render-title" class="render-title"></span>
          <label class="green-toggle">
            <input type="checkbox" id="green-toggle" />
            <span>Green</span>
          </label>
          <button id="render-fullscreen" class="render-icon-btn" aria-label="Fullscreen" title="Fullscreen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 9 4 4 9 4"/><polyline points="20 9 20 4 15 4"/><polyline points="4 15 4 20 9 20"/><polyline points="20 15 20 20 15 20"/></svg>
          </button>
          <button id="render-close" class="render-close" aria-label="Close">×</button>
        </div>
        <div class="render-body">
          <img id="render-img" class="render-img" alt="" />
          <div id="render-missing" class="render-missing" style="display:none"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
